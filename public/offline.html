<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f9eff4" />
    <title>Sem conexão · Madu Acessórios</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "Segoe UI", sans-serif; color: #2d1d25; background: #f9eff4; }
      body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); padding: 32px; box-sizing: border-box; border: 1px solid #f1dfe9; border-radius: 28px; background: #fffafc; text-align: center; box-shadow: 0 16px 32px rgb(139 94 124 / 12%); }
      img { width: 144px; height: 144px; margin: 0 auto 24px; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { color: #5d4454; line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 12px; padding: 0 20px; border-radius: 999px; background: #8b5e7c; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/brand/madu-app-icon.svg" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet e tente novamente. Catálogo, estoque e ações da loja precisam de conexão para serem atualizados.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
